# Tests every push and builds the Windows .exe.
# - Every push: the .exe is attached to the workflow run as an artifact.
# - Tags like v0.2.0: additionally a GitHub release with the .exe is created.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v2.17.1
  NODE_VERSION: '22'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend – type check and unit tests
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Backend – unit tests
        run: go test ./internal/...

  windows:
    name: Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Storage tests on Windows
        run: go test ./internal/...

      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./wails.json').info.productVersion")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: wails build -platform windows/amd64 -clean -trimpath -skipbindings

      - name: Name the .exe after its version
        shell: bash
        run: mv build/bin/Budgeting.exe "build/bin/Budgeting-${{ steps.version.outputs.version }}-windows-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: Budgeting-${{ steps.version.outputs.version }}-windows-x64
          path: build/bin/*.exe
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
