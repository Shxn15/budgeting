<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Budgeting</title>
    <script>
      // Apply the theme before the first paint so there is no flash.
      // localStorage only mirrors the setting stored in data.json.
      (function () {
        var pref = 'system';
        var palette = 'standard';
        try {
          pref = localStorage.getItem('budgeting.theme') || 'system';
          palette = localStorage.getItem('budgeting.palette') || 'standard';
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.palette = /^[a-z]{2,20}$/.test(palette) ? palette : 'standard';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
